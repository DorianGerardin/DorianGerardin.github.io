<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/img/logo-dark.png">
    <link rel="stylesheet" type="text/css" href="static/Styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>All my apps</title>
</head>
<body class="visibilityHidden">

<div class="switchThemeContainer">
    <div id="moon" class="switchThemeButton icon transparent behind" style="--icon-url:url('img/moon.svg')" onclick="toggleDarkMode(true)"></div>
    <div id="sun" class="switchThemeButton icon transparent behind" style="--icon-url:url('img/sun.svg')" onclick="toggleDarkMode(false)"></div>
</div>

<h1>MY APPS</h1>
<div id="app" class="fullWidth flexCenter">

    <div class="cardsToolbar">
        <button id="toggleDetails" class="detailsToggle" type="button" aria-pressed="false"
                title="Masquer les descriptions et les tags" aria-label="Masquer les descriptions et les tags">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
                <line class="slash" x1="3" y1="21" x2="21" y2="3"/>
            </svg>
            <span class="detailsToggleLabel">Détails</span>
        </button>
    </div>

    <div id="selectedTags">
    </div>

    <!-- Les cartes sont générées par Script.js à partir de static/data/projects.json -->
    <div class="cardContainer" id="cardContainer">
    </div>
</div>

</body>

<script src="static/Script.js"></script>
</html>
